# Netlify config for UIUG Astro (SSG). If building from repo root, set base directory to this folder.

[build]
  command = "npm run build"
  publish = "dist"

# Long-lived cache for hashed assets (CDN) to reduce re-downloads
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
